name: Build and Release Standalone Executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconsole --onefile --name Indentation indentation/gui.py

      - name: Zip executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf Indentation-${{ github.ref_name }}-${{ runner.os }}.tar.gz -C dist Indentation

      - name: Zip executable (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Indentation.exe -DestinationPath Indentation-${{ github.ref_name }}-Windows.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Indentation-${{ github.ref_name }}-Windows.zip
            Indentation-${{ github.ref_name }}-${{ runner.os }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}